services:
  mysql-enrollment:
    image: mysql:8.0
    container_name: enrollment-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: enrollmentdb
    ports:
      - "3308:3306"
    volumes:
      - enrollment_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  enrollment-service:
    build: .
    container_name: enrollment-service
    restart: always
    depends_on:
      mysql-enrollment:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8095
      DB_HOST: mysql-enrollment
      DB_PORT: 3306
      DB_NAME: enrollmentdb
      DB_USER: root
      DB_PASSWORD: rootpassword
      STUDENT_SERVICE_URL: http://host.docker.internal:8090
    ports:
      - "8095:8095"

  nginx-enrollment:
    image: nginx:alpine
    container_name: enrollment-nginx
    restart: always
    depends_on:
      - enrollment-service
    ports:
      - "8096:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  enrollment_mysql_data:
