apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrollment-deployment
  namespace: enrollment-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enrollment-service
  template:
    metadata:
      labels:
        app: enrollment-service
    spec:
      containers:
        - name: enrollment-service
          image: enrollment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8095
          env:
            - name: SERVER_PORT
              valueFrom:
                secretKeyRef:
                  name: enrollment-secret
                  key: app-port
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: STUDENT_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: enrollment-secret
                  key: student-service-url
